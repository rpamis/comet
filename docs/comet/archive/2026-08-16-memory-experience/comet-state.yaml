acceptance:
  - id: A1
    source: specs/memory-experience/spec.md
    text: 有可靠命中 - **WHEN** 用户以任务、路径、操作、类别、标签、关键词和作用域查询 - **THEN** 只返回
      active、无未解决冲突、未被暂停且匹配的记录 - **AND** 结果遵守
      maxEntries/maxBytes，排序稳定，记录内容来自权威状态
    result: passed
    reason:
      text: CLI 已转发完整检索过滤和 maxEntries/maxBytes 边界。
      truncated: false
  - id: A2
    source: specs/memory-experience/spec.md
    text: 无可靠命中 - **WHEN** 查询没有可靠匹配 - **THEN** 返回空结果并 abstain - **AND**
      不注入泛化、冲突、inactive、tombstoned 或暂停记录
    result: passed
    reason:
      text: 检索过滤 inactive、冲突和暂停项目，未命中返回空结果。
      truncated: false
  - id: A3
    source: specs/memory-experience/spec.md
    text: 纠正与遗忘 - **WHEN** 用户显式纠正或遗忘一条记忆 - **THEN** 当前检索立即使用新内容或不再返回旧内容 - **AND**
      旧证据和旧 Git 同步不能使已遗忘内容复活 - **AND** 用户可以查看历史并回滚，永久删除需要明确的管理操作
    result: passed
    reason:
      text: correct、forget、rollback 使用公开服务，forget 保留 tombstone，永久删除需显式操作。
      truncated: false
  - id: A4
    source: specs/memory-experience/spec.md
    text: 后台操作 - **WHEN** 后台评审、候选形成、重复计数或同步在运行 - **THEN** 默认不向普通消息输出过程 - **AND**
      只有首次实际改变处理方式或发生冲突时才显示简短说明
    result: passed
    reason:
      text: 后台 observe 和同步保持静默且非阻塞。
      truncated: false
  - id: A5
    source: specs/memory-experience/spec.md
    text: 语言选择 - **WHEN** 配置语言为 `zh-CN` 或 `en` - **THEN** 自动生成的用户可见内容分别使用中文或英文 -
      **AND** 直接输入正文不被静默翻译
    result: passed
    reason:
      text: 语言按 default_workflow 选择并贯穿 CLI、Markdown root heading 和 Dashboard label。
      truncated: false
  - id: A6
    source: specs/memory-experience/spec.md
    text: 同源管理 - **WHEN** 用户通过 CLI 修改记忆 - **THEN** Dashboard 后续读取到相同的权威状态、冲突、历史和同步状态
      - **AND** 反向通过 Dashboard 修改也能被 CLI 读取
    result: passed
    reason:
      text: CLI 和 Dashboard 访问同一 Personal Memory 权威状态。
      truncated: false
  - id: A7
    source: specs/memory-experience/spec.md
    text: 手工编辑与同步失败 - **WHEN** 用户编辑、删除 Markdown，或专用 memory Git 同步失败 - **THEN**
      下次管理/检索按确定性规则更新状态并保留必要历史/tombstone - **AND** 本地记忆继续可用，返回清晰的非阻塞同步状态
    result: passed
    reason:
      text: Markdown reconciliation、tombstone 和 Git 非阻塞回归通过。
      truncated: false
  - id: A8
    source: specs/memory-experience/spec.md
    text: Personal Memory
      必须提供有界、可解释、稳定排序的检索和管理投影。投影可以显示范围、项目、类别、标签、来源类型、证据数量、最后确认时间和冲突状态，但不能泄露
      Runtime 文件、candidate ID、evidenceKeys、完整来源或隐藏过程。
    result: passed
    reason:
      text: records 与 conflicts 共用 maxEntries/maxBytes，冲突按查询关联过滤且不返回 recordIds。
      truncated: false
  - id: A9
    source: specs/memory-experience/spec.md
    text: CLI 和 Dashboard 必须通过公开 Personal Memory 能力执行
      remember、correct、forget、rollback、pause 和 sync。操作必须立即影响检索、Markdown
      和管理投影，并以当前配置语言提供短确认或错误。
    result: passed
    reason:
      text: pause 和 sync 使用按当前语言输出的短确认。
      truncated: false
  - id: A10
    source: specs/memory-experience/spec.md
    text: 自动生成的管理标题、类别、标签和原因必须使用配置语言；直接 CLI 输入的记忆正文必须保持用户原文。机器字段、schema、action 和
      scope 保持稳定英文。
    result: passed
    reason:
      text: 自动生成标题和 Dashboard 文案按配置语言生成，直接输入正文保持原文。
      truncated: false
  - id: A11
    source: specs/memory-experience/spec.md
    text: CLI 和 Dashboard 必须从同一个公开插件能力读取状态和执行管理动作，不能各自读取 Runtime state 或维护投影副本。JSON
      输出必须稳定、可供脚本使用；普通文本不得直接 dump 内部状态。
    result: passed
    reason:
      text: 管理投影和 Dashboard 通过公开插件能力，同源 JSON 稳定且普通 list 不 dump Runtime。
      truncated: false
  - id: A12
    source: specs/memory-experience/spec.md
    text: 用户可读的 `profile.md` 和 `projects/<project-key>.md` 必须保持简洁、可编辑，并与 Runtime
      状态确定性 reconciliation。Git remote 缺失、同步冲突或失败不得阻塞本地检索和管理。
    result: passed
    reason:
      text: 管理和检索复用确定性 Markdown reconciliation，Git 失败不阻塞本地。
      truncated: false
