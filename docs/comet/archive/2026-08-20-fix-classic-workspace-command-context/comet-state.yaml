acceptance:
  - id: A1
    source: brief.md
    text: "A1: 在 Classic 项目根目录运行 `comet classic workspace prepare <name> --isolation
      current --json`，返回 `exitCode: 0` 且包含 `projectRoot`，不再返回 `exitCode: 70` /
      `Classic command project context is unavailable`。"
    result: passed
    reason:
      text: "Manual CLI repro in a fresh temp Classic project: `node comet-runtime.mjs
        workspace prepare probe-current --isolation current --json` returns
        exitCode 0 with a populated projectRoot; no longer exitCode 70 /
        'Classic command project context is unavailable'."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 同样命令分别用 `--isolation branch` 和 `--isolation worktree` 运行，均返回
      `exitCode: 0`（不要求真实创建 branch/worktree 全部成功，但不得因 context 缺失而失败）。"
    result: passed
    reason:
      text: Same manual repro with --isolation branch and --isolation worktree both
        return exitCode 0 (branch created, worktree created and registered).
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 运行 `comet classic workspace resolve <name> --json`，返回 `exitCode: 0` 且
      `projectRoot` 与实际项目根目录一致。"
    result: passed
    reason:
      text: classic-workspace-command.test.ts 'resolves a workspace without a
        caller-established context' seeds a change and asserts
        classicWorkspaceCommand(['resolve', name], options) returns exitCode 0
        with projectRoot equal to the project root.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: `classicWorkspaceCommand` 新增的单元测试覆盖 A1-A3 对应的 `resolve`/`prepare` ×
      `current`/`branch`/`worktree` 组合，且全部通过。"
    result: passed
    reason:
      text: test/domains/comet-classic/classic-workspace-command.test.ts covers
        prepare x {current,branch,worktree} and resolve, calling the handler
        directly with no context pre-established by the caller (reproducing the
        original bug's call shape). All 5 tests pass.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: `withProjectContext` 新增单元测试验证两种路径都成立：外部未建立 context 时调用会现场建立一次；已经处于
      `withClassicCommandContext` 建立的 context 中再调用会直接复用而不重复解析。"
    result: passed
    reason:
      text: "test/domains/comet-classic/classic-command-context.test.ts covers both
        withProjectContext paths: establishing a context when none is active,
        and reusing an already-active outer context instead of re-resolving from
        the inner call's own options. Both tests pass."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: `guard`/`state`/`handoff`/`validate`/`resume-probe` 五个已迁移到
      `withProjectContext` 的
      handler，其既有测试套件（`test/domains/comet-classic/`）在改写后无需修改断言即可继续通过，证明这次重构没有改变\
      它们的行为。"
    result: passed
    reason:
      text: classic-guard.test.ts, classic-handoff.test.ts, classic-state.test.ts,
        classic-resume-probe-command.test.ts, and classic-resume-probe.test.ts
        all pass unmodified after migrating their handlers to
        withProjectContext, confirming no behavior change.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: `pnpm build:classic-runtime --check` 与 `npx vitest run
      test/domains/comet-classic/comet-scripts.test.ts` 通过。"
    result: passed
    reason:
      text: node scripts/build/build-classic-runtime.mjs --check passes
        (comet-runtime.mjs and sibling launchers regenerated and fresh); npx
        vitest run test/domains/comet-classic/comet-scripts.test.ts passes
        220/221 (1 pre-existing skip).
      truncated: false
