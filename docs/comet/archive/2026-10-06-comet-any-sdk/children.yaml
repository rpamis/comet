schema: comet.native.children.v2
acceptance_index:
  A1:
    source: brief.md
    text: '三种起点均能形成可运行的 Application 包；入口 Skill 能启动并继续对应流程，展示实际验证范围。'
  A2:
    source: brief.md
    text: '从入口、CLI 和恢复入口访问同一 Run；修改说明文件或投影视图不能绕过已声明的执行规则。'
  A3:
    source: brief.md
    text: '定制应用经公开入口启动、查询和继续均路由正确；同名不同项目或 worktree 不会串用 Run。'
  A4:
    source: brief.md
    text: '修改同版本定义、依赖 Skill 或资源后，活动 Run 拒绝按新内容继续；恢复原依赖后可以沿原记录恢复。'
  A5:
    source: brief.md
    text: '未满足依赖的越序回报、旧 attempt、错误 Action 归属和陈旧提案不能推进；合法并行 Action 可按任意完成顺序回报；断连后保留原 Action，已发生的外部操作不被自动重发。'
  A6:
    source: brief.md
    text: 'Native 样板增加候选审查后，未通过审查不能进入后续验收；未配置扩展的 Native 不新增外部 Skill 依赖。'
  A7:
    source: brief.md
    text: 'Builder 获得指定版本的指导和范围；产物违反可检查的指导要求时，即使已经加载 Skill 也不能通过对应验收。'
  A8:
    source: brief.md
    text: '审查失败可回 Build 修复；新候选重做已失效的检查；额外审查通过不能直接跳过 Native 独立验收或取得交付授权。'
  A9:
    source: brief.md
    text: '扩展引入需求变化会返回 Shape 重新确认；未改变确认范围的实现修复沿修复流程继续。'
  A10:
    source: brief.md
    text: '普通 Native、Supervisor 父级、Child 和集成验收中的扩展均有效；跨会话继续仍保留要求，父级加载一次 Skill 不能代替 Child 的执行与验收。'
  A11:
    source: brief.md
    text: '定制 Classic 在各受影响 profile 中可完成真实流程；无效替换或顺序变化被解释并拒绝，不用文本成功声明替代领域验收。'
  A12:
    source: brief.md
    text: 'Classic 新增或替换的工作发生失败、工件变化和中断时可恢复；基础命令不能绕过组合应用新增的必需检查。'
  A13:
    source: brief.md
    text: '独立报告流程在审批前不发布，拒绝或修改后走声明路径，跨进程继续同一 Run；不宣称自动继承 Native 独立验收语义。'
  A14:
    source: brief.md
    text: '真实内容不支持所要求能力、依赖缺失或输入输出不匹配时不能生成虚假可运行承诺；第三方原文件不被改写。'
  A15:
    source: brief.md
    text: '含有自行发布或接管审批逻辑的 Skill 不能作为普通指导绕过父流程；加载、自报完成、机器检查和独立评审能被区分。'
  A16:
    source: brief.md
    text: '相同方案与依赖生成一致的有效产物；未声明转换、缺失验证器及重复或冲突身份在执行前被发现。'
  A17:
    source: brief.md
    text: '非法 JSON、缺失必填数据、过期工件、错误候选和伪造完成字符串无法满足相应检查；拒绝后保留现场并给出修正动作。'
  A18:
    source: brief.md
    text: '在方案确认或编译验证期间中断后能继续同一次创作；方案变化使受影响的确认和验证失效，不重复执行已明确完成的外部工作。'
  A19:
    source: brief.md
    text: '用户能从自然语言需求完成创作；看到实际流程和安装预览；方案或安装目标漂移时原确认不能被复用。'
  A20:
    source: brief.md
    text: 'Claude Code 完成真实 Skill 调用、必要交接和中断恢复；必需能力缺失时明确阻塞，不静默跳过。Codex 适配保留对应的本地契约与回归检查，报告明确未执行其真实宿主和模型验收。'
  A21:
    source: brief.md
    text: '外部操作结果丢失后可按适配契约查询或核对，不盲目重复发送或部署；没有核对能力时明确阻塞；产物和持久化记录不包含凭据。'
  A22:
    source: brief.md
    text: '真实导出包在项目级与用户级目标安装后均可启动和恢复；同名冲突、升级与有活动 Run 的卸载按明确规则处理；不要求远程分发服务。'
  A23:
    source: brief.md
    text: '新产物只走 SDK 应用链，产品不再依赖旧生成和推进逻辑；旧格式被明确拒绝并提示重新生成，不被静默加载或自动转换，用户文件不被自动删除。'
  A24:
    source: brief.md
    text: 'Claude Code 的全部指定流程及恢复场景在当前候选上满足已确认矩阵中的所有规定样本；外部结果核对后操作计数为一；未运行、失败、超时或缺少真实宿主及模型证据时不能完成生产验收。'
  A25:
    source: brief.md
    text: '先完成能运行、失败可修复和冷恢复的 Native 样板，再扩展生成能力；基础应用和 SDK 既有契约通过相关回归检查。'
  A26:
    source: brief.md
    text: '产品文档与真实行为一致；中英文 Skill 同步后再更新对应发布说明；检查与修改范围可追溯。'
children:
  - name: application-foundation
    depends_on: []
    covers: ['A2', 'A3', 'A4', 'A5', 'A14', 'A15']
  - name: native-extensions
    depends_on: ['application-foundation']
    covers: ['A6', 'A7', 'A8', 'A9', 'A10']
  - name: classic-composition
    depends_on: ['native-extensions']
    covers: ['A11', 'A12']
  - name: standalone-composition
    depends_on: ['native-extensions']
    covers: ['A13']
  - name: application-compiler
    depends_on: ['classic-composition', 'standalone-composition']
    covers: ['A16', 'A17']
  - name: creator-experience
    depends_on: ['application-compiler']
    covers: ['A18', 'A19', 'A20']
  - name: delivery-validation
    depends_on: ['creator-experience']
    covers: ['A1', 'A21', 'A22', 'A23', 'A24', 'A25', 'A26']
