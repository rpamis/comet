f.md","text":"A6：确认仍绑定完整当前提案及 Runtime 的有效版本、动作或提案哈希，过期批准不能覆盖新方案，旧验收不能覆盖新需求；恢复后仍等待必要的用户决定，配置确认不代替需求、交付或工具权限。"},{"id":"A7","source":"brief.md","text":"A7：中文与英文 Skill、Runtime 模板、校验及提示保持一致；受影响契约回归、生成物检查和临时项目公开 CLI 验证通过，包括拒绝后修复继续；独立 Verifier 覆盖全部验收项，未执行的真实模型对照实验明确标注。"}],"children":null,"formalHash":"00c5c5e57071fb1c16c0a48caaf50d225636a68bad3527bd499d99899fa15877","shapeConfirmationHash":"422ec542cedc15127b95b15e9a3ee3677745bc16ca6369a0bda54c9aa6125076","specChanges":[{"capability":"classic-efficiency","operation":"modify","source":"specs/classic-efficiency/spec.md"},{"capability":"native-document-constraints","operation":"modify","source":"specs/native-document-constraints/spec.md"},{"capability":"native-shape-confirmation","operation":"modify","source":"specs/native-shape-confirmation/spec.md"}]}}},"proposalHash":"41da80e0573f9a0e0d76320b2c09579889497842492cab71d3ec70e29511e9f8","choices":["approved","rejected"],"results":{},"decision":{"id":"d64134c5001609f10bb8b8f7ef8387a7249a8d2a6b4ab4ee1a2c788d7c7fd933","choice":"approved","proposalHash":"41da80e0573f9a0e0d76320b2c09579889497842492cab71d3ec70e29511e9f8"}},{"id":"native-classic-flow-optimization:9","stepId":"verify.checks-stop","sequence":9,"status":"resolved","proposal":{"activation":{"failedCheckActionId":"native-classic-flow-optimization:8"},"input":{"artifactRootRef":"docs","name":"native-classic-flow-optimization"},"outputs":{"verify.checks":{"candidateId":"cb051967db480ea81167ee1c15af6cca70309535d436e869796d1f82504bc1b5","checks":[{"argvDisplay":["node_modules/vitest/vitest.mjs","run","test/domains/comet-native/native-document-constraints.test.ts","test/domains/comet-native/native-artifact-language.test.ts","test/domains/comet-native/native-document-constraints-compatibility.test.ts","test/domains/comet-native/native-skill.test.ts","test/domains/skill/workflow-optimization-contract.test.ts","test/repository/release-metadata.test.ts","test/repository/contributor-instructions.test.ts","test/repository/developmen