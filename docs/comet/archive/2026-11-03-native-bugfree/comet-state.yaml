ce":15},"native-bugfree:16":{"results":{},"sequence":16},"native-bugfree:17":{"results":{},"sequence":17},"native-bugfree:18":{"results":{},"sequence":18},"native-bugfree:3":{"results":{},"sequence":3},"native-bugfree:4":{"results":{},"sequence":4},"native-bugfree:5":{"results":{},"sequence":5},"native-bugfree:6":{"results":{},"sequence":6},"native-bugfree:7":{"results":{},"sequence":7},"native-bugfree:8":{"results":{},"sequence":8},"native-bugfree:9":{"results":{},"sequence":9}},"waits":[{"id":"native-bugfree:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"native-bugfree"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"配置省略、两种合法值：缺省 standard，合法值往返不变。"},{"id":"A2","source":"brief.md","text":"非法配置类型和值：明确拒绝，不能静默退回 standard。"},{"id":"A3","source":"brief.md","text":"init/update/配置合并：保留模式、未知字段及未涉及配置；不恢复预算字段。"},{"id":"A4","source":"brief.md","text":"新 Run 创建：从项目配置固定模式，状态和 Shape 展示相同。"},{"id":"A5","source":"brief.md","text":"旧 Run 与旧定义：缺字段继续 standard；伪造 bugfree 字段不能改变旧定义。"},{"id":"A6","source":"brief.md","text":"中途修改配置：当前 Run 模式不变，新 Run 使用新值。"},{"id":"A7","source":"brief.md","text":"checkpoint 恢复：保留原模式、候选、Action 和审查来源；不读取本机模式替代。"},{"id":"A8","source":"brief.md","text":"普通候选空命令计划：零子进程检查，仍有候选绑定，必须等待独立 Verifier。"},{"id":"A9","source":"brief.md","text":"standard 行为：原检查模板、完整结果校验及新候选独立审查语义不被放宽。"},{"id":"A10","source":"brief.md","text":"主 Agent 冒充 Verifier：相同 Builder 身份、参与过实现的会话或错误 claim 均不能通过。"},{"id":"A11","source":"brief.md","text":"同一候选重复派发：已运行/未知 Action 不产生第二个正式 Verifier。"},{"id":"A12","source":"brief.md","text":"紧凑全部通过：明确 ID 完整覆盖才通过，报告按实际方法生成。"},{"id":"A13","source":"brief.md","text":"紧凑集合异常：漏项、未知 ID、重复、交叉重复、混用 passed 均拒绝。"},{"id":"A14","source":"brief.md","text":"总 verdict 与逐项不一致：按第 10 节规则拒绝，不能靠总 pass 补齐结论。"},{"id":"A15","source":"brief.md","text":"完整旧结果：旧格式仍可读；standard 不接受 bugfree 专用字段。"},{"id":"A16","source":"brief.md","text":"必需检查失败：紧凑 pass 仍被拒绝；旧成功、换 ID 和删除计划不能掩盖当前失败。"},{"id":"A17","source":"brief.md","text":"真实检查复用：复用原 Action 和日志，保持环境、计划与完整输入校验。"},{"id":"A18","source":"brief.md","text":"同候选补查：原会话继续，检查只执行请求集合，不扩为全量。"},{"id":"A19","source":"brief.md","text":"两轮补查上限：沿用原上限，未解决问题不能自动通过。"},{"id":"A20","source":"brief.md","text":"修复后续审：新 Action 绑定新候选；符合条件时建议原会话，覆盖全部验收 ID。"},{"id":"A21","source":"brief.md","text":"续审不满足条件：会话丢失、参与修改、需求变化、工作区变化时选择 fresh。"},{"id":"A22","source":"brief.md","text":"用户要求重新验收：新 attempt 使用新独立上下文，保留原历史。"},{"id":"A23","source":"brief.md","text":"输入缺失或漂移：不完整快照、并发改写、正式需求漂移均不能通过。"},{"id":"A24","source":"brief.md","text":"报告失败恢复：不重新调用模型，恢复原报告 Action。"},{"id":"A25","source":"brief.md","text":"接受与 Archive：未接受不归档；接受后继续核对绑定；未知副作用不重放。"},{"id":"A26","source":"brief.md","text":"Supervisor 作用范围：仅父级最终 Verify 启用；Child/集成原要求不变。"},{"id":"A27","source":"brief.md","text":"Native 扩展应用：扩展步骤仍执行，旧固定应用不被配置升级。"},{"id":"A28","source":"brief.md","text":"精简任务包：无 Builder 自评、完整聊天和成功日志正文；需求、失败及所有验收项仍可取得。"},{"id":"A29","source":"brief.md","text":"任务包变化范围：首次覆盖 change 全部实现差异；续审另提供相邻差异，包含删除/重命名/未跟踪文件。"},{"id":"A30","source":"brief.md","text":"报告事实：零命令不写测试通过；复用不写新执行；模式、方法和结果一致。"},{"id":"A31","source":"brief.md","text":"公开 CLI 与 bundle：新建、领取、回报、补查、接受、恢复均从公开入口完成。"},{"id":"A32","source":"brief.md","text":"安装包：临时项目安装实际 npm 打包产物后配置生效，未携带仓库源码仍可运行。"},{"id":"A33","source":"brief.md","text":"平台独立会话：平台真实创建和恢复会话；身份独立，等待超时不重派。"},{"id":"A34","source":"brief.md","text":"历史与其他 workflow：Compat、Classic、历史 archive 和旧 SDK checkpoint 保持原行为。"},{"id":"A35","source":"brief.md","text":"修复后处理前轮诊断失败：用户要求的执行检查仍需真实通过；自主诊断失败可由独立 Verifier 确认语义修复，历史失败不得被隐藏或写成测试通过。"},{"id":"A36","source":"brief.md","text":"模型对照授权与证据边界：遵守来源第16节；未获明确授权不启动 Eval，准备冻结案例、独立判定和指标采集；未执行时保留待验证状态，不宣称正确率或性能收益。"},{"id":"A37","source":"brief.md","text":"产品文档与发布资产：按来源第17—18节同步正式规格、中文及经确认的英文 Skill、配置说明和 Runtime 生成资产；根据实际 master/tag 决定版本与英文 Changelog，分别记录各验证层级。"}],"children":null,"formalHash":"4fd18243695afcfb7e8083868411705ac82a7e175c1952df0e90b52e560f2ccc","semanticSnapshot":{"artifacts":[{"auxiliary":[],"comm