n 和日志，保持环境、计划与完整输入校验。"},{"id":"A18","source":"brief.md","text":"同候选补查：原会话继续，检查只执行请求集合，不扩为全量。"},{"id":"A19","source":"brief.md","text":"两轮补查上限：沿用原上限，未解决问题不能自动通过。"},{"id":"A20","source":"brief.md","text":"修复后续审：新 Action 绑定新候选；符合条件时建议原会话，覆盖全部验收 ID。"},{"id":"A21","source":"brief.md","text":"续审不满足条件：会话丢失、参与修改、需求变化、工作区变化时选择 fresh。"},{"id":"A22","source":"brief.md","text":"用户要求重新验收：新 attempt 使用新独立上下文，保留原历史。"},{"id":"A23","source":"brief.md","text":"输入缺失或漂移：不完整快照、并发改写、正式需求漂移均不能通过。"},{"id":"A24","source":"brief.md","text":"报告失败恢复：不重新调用模型，恢复原报告 Action。"},{"id":"A25","source":"brief.md","text":"接受与 Archive：未接受不归档；接受后继续核对绑定；未知副作用不重放。"},{"id":"A26","source":"brief.md","text":"Supervisor 作用范围：仅父级最终 Verify 启用；Child/集成原要求不变。"},{"id":"A27","source":"brief.md","text":"Native 扩展应用：扩展步骤仍执行，旧固定应用不被配置升级。"},{"id":"A28","source":"brief.md","text":"精简任务包：无 Builder 自评、完整聊天和成功日志正文；需求、失败及所有验收项仍可取得。"},{"id":"A29","source":"brief.md","text":"任务包变化范围：首次覆盖 change 全部实现差异；续审另提供相邻差异，包含删除/重命名/未跟踪文件。"},{"id":"A30","source":"brief.md","text":"报告事实：零命令不写测试通过；复用不写新执行；模式、方法和结果一致。"},{"id":"A31","source":"brief.md","text":"公开 CLI 与 bundle：新建、领取、回报、补查、接受、恢复均从公开入口完成。"},{"id":"A32","source":"brief.md","text":"安装包：临时项目安装实际 npm 打包产物后配置生效，未携带仓库源码仍可运行。"},{"id":"A33","source":"brief.md","text":"平台独立会话：平台真实创建和恢复会话；身份独立，等待超时不重派。"},{"id":"A34","source":"brief.md","text":"历史与其他 workflow：Compat、Classic、历史 archive 和旧 SDK checkpoint 保持原行为。"},{"id":"A35","source":"brief.md","text":"修复后处理前轮诊断失败：用户要求的执行检查仍需真实通过；自主诊断失败可由独立 Verifier 确认语义修复，历史失败不得被隐藏或写成测试通过。"},{"id":"A36","source":"brief.md","text":"模型对照授权与证据边界：遵守来源第16节；未获明确授权不启动 Eval，准备冻结案例、独立判定和指标采集；未执行时保留待验证状态，不宣称正确率或性能收益。"},{"id":"A37","source":"brief.md","text":"产品文档与发布资产：按来源第17—18节同步正式规格、中文及经确认的英文 Skill、配置说明和 Runtime 生成资产；根据实际 master/tag 决定版本与英文 Changelog，分别记录各验证层级。"}],"children":null,"formalHash":"4fd18243695afcfb7e8083868411705ac82a7e175c1952df0e90b52e560f2ccc","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf