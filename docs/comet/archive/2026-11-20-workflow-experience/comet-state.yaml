children_contract:
  schema: comet.native.children.v2
  acceptance_index:
    A1:
      source: brief.md
      text: Classic 在只读报告中将常驻 Rule、阶段 Skill 或引用、CLI
        响应分别归因，可区分静态估算、真实追踪用量和缺失数据。普通聊天维持原行为。
    A2:
      source: brief.md
      text: 使用同一个完整 Classic fixture
        对比，至少一项可避免的上下文重复交付下降。报告给出可比口径和结果，同一工作区仍能完成批准、恢复及独立验收，双语流程语义一致。
    A3:
      source: brief.md
      text: Native 在交接、独立 Verify 及冷恢复中为每条已确认验收呈现候选证据或缺口。普通变更和 Supervisor 子变更从同一权威 Run
        读取，不复用错候选证据。
    A4:
      source: brief.md
      text: Native Verifier 在现有报告留下新增或重跑检查的原因，旧 Run
        可读，失败、未知和未执行仍按实际状态展示。当前候选独立验收继续覆盖全部验收项。
    A5:
      source: brief.md
      text: Eval 通过现有入口和报告结构使用固定小套件，可用确定性用例检查中断恢复、独立
        Verify、范围变化后重新确认，标明每个用例适用的工作流和配对身份。
    A6:
      source: brief.md
      text: Eval 对匹配的用例报告 outcome 差异及可观测的工具往返、等待耗时和上下文量。缺数保持未知，确定性验证覆盖正常配对和不可比较样本。
    A7:
      source: brief.md
      text: Dashboard 对同一项目的进行中 Native 和 Classic
        条目呈现等待用户、可执行、结论未知或验收受阻。验证工作树身份、旧资料兼容和已完成历史条目的过滤。
    A8:
      source: brief.md
      text: 浏览器验证从待关注项进入原始 change、Supervisor
        子变更和证据详情。等待依赖、派发或集成的说明源自权威状态，缺少原因时明确显示未知，审批和恢复仍走现有入口。
  children:
    - name: classic-context
      summary: null
      depends_on: []
      covers:
        - A1
        - A2
    - name: native-evidence
      summary: null
      depends_on: []
      covers:
