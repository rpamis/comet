    reason:
      text: 显式记忆不受自动学习开关影响，检索/项目暂停彼此独立。
      truncated: false
  - id: A9
    source: brief.md
    text: 同一仓库的 worktree 和重新克隆使用同一项目 key；不同 fork 使用不同项目 key，默认不加载原项目记忆。
    result: passed
    reason:
