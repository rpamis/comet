    result: passed
    reason:
      text: remember API 立即持久化并可通过 retrieve 返回来源。
      truncated: false
  - id: A14
    source: specs/self-evolving-personal-memory/spec.md
    text: 两个独立成功 change 自动学习 两个不同 change
      在成功检查点提供同一规范化行为且无冲突。第一次只保留候选，第二次后服务自动写入当前作用域，不要求用户确认；同一 change 的重复事件不改变计数。
    result: passed
    reason:
      text: 两个不同成功 change 的一致观察自动生效，无需用户确认。
      truncated: false
  - id: A15
    source: specs/self-evolving-personal-memory/spec.md
    text: 用户编辑高于自动更新 用户直接编辑或删除 Markdown
      中的项目记忆。服务检测到文件指纹变化，把编辑视为显式纠正或移除并保留历史；旧观察不能直接写回被移除内容。
    result: passed
    reason:
      text: 管理操作前扫描所有已知项目 Markdown，手工编辑高于旧 Runtime 状态并保留历史。
      truncated: false
  - id: A16
    source: specs/self-evolving-personal-memory/spec.md
    text: 作用域检索有界 项目任务按项目 key、路径和任务类型检索时返回相关项目记忆及适用的全局画像，不返回其他项目详情，并遵守固定条数与字节上限。
    result: passed
    reason:
      text: 按 scope/project/task/path/operation 过滤并执行条数、字节上限；默认包含全局和项目记忆。
      truncated: false
  - id: A17
    source: specs/self-evolving-personal-memory/spec.md
    text: Git 同步失败不阻塞任务 专用 Git 适配器报告 remote 不可用或冲突。服务保留本地文件和历史，返回可读诊断，后续 `sync`
      可重试；当前 workflow 不因同步失败而失败。
    result: passed
    reason:
      text: Git 同步失败返回可重试诊断，不阻塞本地记忆读取。
      truncated: false
  - id: A18
    source: specs/self-evolving-personal-memory/spec.md
    text: 插件公开接入
      宿主用公开插件接口创建个人记忆插件描述符。插件只消费带来源事件、按作用域提供上下文并调用领域服务；停用或卸载后停止新处理但不删除记忆数据。
    result: passed
    reason:
      text: 插件使用公开 descriptor/lifecycle/event/context/invoke 接口。
      truncated: false
  - id: A19
    source: specs/self-evolving-personal-memory/spec.md
    text: 领域服务接收一个专用记忆仓库、当前用户/项目作用域和可选 Git 同步适配器。公开 API 提供
      `remember`、`correct`、`remove`、`rollback`、`observe`、`retrieve`、`status` 与
      `sync`，并可创建符合 `comet-plugin` 公开接口的第一方插件描述符。
    result: passed
    reason:
      text: 领域服务公开 remember/correct/remove/rollback/observe/retrieve/status/sync
        和专用仓库接口。
      truncated: false
  - id: A20
    source: specs/self-evolving-personal-memory/spec.md
    text: 全局记忆写入仓库根目录的 `profile.md`，项目记忆写入
      `projects/<project-key>.md`。文件使用少量标题和列表，不包含 frontmatter、记忆
      ID、状态或证据计数。服务读取文件时把用户新增列表项视为显式记忆，用户修改或移除内容高于后台观察；服务更新时尽量追加或替换目标列表项，不重排无关文字、注释和顺序。
    result: passed
    reason:
      text: 当前内容仅使用用户可读 Markdown，Runtime 元数据与文件指纹分离。
      truncated: false
  - id: A21
    source: specs/self-evolving-personal-memory/spec.md
    text: 来源、候选、稳定证据、删除历史、文件指纹和检索索引保存在仓库的 Runtime 数据中，只保存最小摘要、来源类型、change
      引用、时间和规范化标签。禁止保存完整对话、工具输出、原始 diff、凭据、隐藏推理或 trajectory。
    result: passed
    reason:
      text: Runtime 只保存最小来源、change、证据、历史和索引摘要，不保存完整对话、raw diff、命令输出或 trajectory。
      truncated: false
  - id: A22
    source: specs/self-evolving-personal-memory/spec.md
    text: 普通事件只进入轻量观察；成功 phase 转换、checkpoint、任务完成或 Archive 等稳定点由宿主调用
      `observe`。显式记忆不经过候选阶段。推断记忆必须来自至少两个不同成功 change 的一致、无冲突观察；同一 change 的恢复、跨会话和
      Hotfix/Tweak 升级不增加独立计数。失败或取消只能形成负向或冲突信号。
    result: passed
    reason:
      text: 成功 phase/checkpoint 观察按稳定 change 去重；失败后恢复成功会升级同一观察，两个独立成功证据才激活。
      truncated: false
  - id: A23
    source: specs/self-evolving-personal-memory/spec.md
    text: 检索按作用域、项目身份、任务、路径、操作和关键词做确定性匹配，默认返回全局记忆加当前项目记忆，并以显式来源、项目匹配、结构化匹配、最近确认和稳定
      ID 排序。结果和常驻画像均有固定上限；当前请求与仓库现状由宿主优先处理，旧记忆不得授权外部副作用。
    result: passed
    reason:
      text: 确定性作用域、任务、路径、操作、关键词检索，排序和上限已实现；当前请求/仓库冲突优先留给宿主 integration。
      truncated: false
  - id: A24
    source: specs/self-evolving-personal-memory/spec.md
    text: 首次形成记忆时才初始化专用仓库目录；没有 remote 时本地读写、历史和检索正常。Git
      同步适配器在稳定更新后执行拉取、合并、提交和推送；远端不可用、认证失败或冲突时保留本地数据并返回诊断，不阻塞当前任务。同步只允许操作专用记忆仓库，不能提交或推送用户当前项目。
    result: passed
    reason:
      text: 首次形成记忆才创建文件，Git 无 remote 时本地可用且同步限定专用仓库。
      truncated: false
  - id: A25
    source: specs/self-evolving-personal-memory/spec.md
    text: 并发写入使用进程间锁和原子替换。不同内容必须合并，等价内容按规范化文本去重；用户手动编辑或删除在下一次事务中被识别并优先，后台观察不能静默恢复已移除内容。冲突的同一记忆保留两侧内容，冲突项不参与正常检索，直到用户编辑或新的明确证据解决。
    result: passed
    reason:
      text: 跨进程锁、原子写入、二次指纹检查及冲突候选隔离避免静默覆盖。
      truncated: false
