    source: brief.md
    text: 两个并发写入增加不同记忆时都保留；等价内容只出现一次；并发手动删除后，旧观察不会静默写回。
    result: passed
    reason:
      text: 进程锁、等价去重、不同内容合并及手工编辑指纹保护均已覆盖。
