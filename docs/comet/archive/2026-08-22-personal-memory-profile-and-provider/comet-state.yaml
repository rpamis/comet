    text: "**A4 独立 User Profile**：检索开启时，系统单独生成完整的紧凑 User Profile 区块；不设条目数上限，默认按
      2,000 个 Unicode 字符控制容量，能够包含姓名/角色/时区/技术背景、语言、沟通方式和稳定协作偏好，不依赖当前任务关键词才出现。"
    result: passed
    reason:
      text: 独立 User Profile 区块、容量控制和稳定检索已实现。
      truncated: false
