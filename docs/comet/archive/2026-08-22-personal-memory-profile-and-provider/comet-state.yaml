    text: "**A1 显式画像**：用户说“以后都用中文回答”或“记住：回答简洁一些”后，该偏好立即成为 active User
      Profile，下一次任务能够使用，无需等待第二次证据。"
    result: passed
    reason:
      text: 显式 User Profile 记忆已实现并由相关回归测试覆盖。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 一次性要求**：用户说“这次只列三条”只影响当前请求，不进入候选、User Profile 或项目记忆。"
    result: passed
    reason:
      text: 一次性要求的过滤逻辑已实现并由回归测试覆盖。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 排除 Agent 工作信息**：CLI 用法、Change 状态、测试结果、提交摘要、工具输出、Agent 自己的计划和
      `workflow-operation` 内容不会形成候选，也不会进入任何上下文。"
    result: passed
    reason:
      text: Agent 工作信息过滤与历史迁移逻辑已实现并由回归测试覆盖。
      truncated: false
