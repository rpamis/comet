    text: 用户在项目规则页对未初始化项目点击“初始化”，只得到盘点摘要；点击“重新扫描”更新来源和验证入口；对候选执行加入、忽略或稍后与 Skill/CLI
      语义一致。
    result: passed
    reason:
      text: 项目规则初始化、扫描和候选处理均经公开插件能力执行。
      truncated: false
