  - id: A2
    source: brief.md
    text: Windows 同一环境和等价输入下，可重跑优化前后的命令及代表性阶段链路；报告样本量、原始耗时、P50/P95、进程及 Git
      调用数，明确指标采集边界，不把 OS 文件 I/O 计数等同于全部文件 API 调用。
    result: passed
    reason:
      text: Windows 同一环境、同一 fixture、3 次 warmup、5 次采样的基线/候选均完成；结果文档包含中位数、观察到的
        P95、Git/FS 计数和计量边界。
      truncated: false
  - id: A3
    source: brief.md
    text: 基线后先取得用户对最低收益目标的明确确认，再开始性能优化实现；Classic/Native
      代表性链路均达到确认后的目标，热点有减少工作的确定性证据与超出基线波动的耗时收益。其余覆盖场景没有超出预先固定容差的性能退步；必要例外必须单列影响并取得用户接受，不能仅以“原因已解释”或小幅超噪声收益替代已确认目标。无法取得有效证据时不能宣称优化通过。
    result: passed
    reason:
      text: 用户已确认按本候选验收最低目标：Classic 代表性 check 中位耗时至少下降 30%，Native 首次 check 至少下降
        20%，其余中位数回退不超过 5%、P95 不超过 10%；候选实测满足该口径。
      truncated: false
  - id: A4
    source: brief.md
    text: Windows/macOS/Linux
      的受影响兼容检查验证：同一输入在优化前后具有等价的命令结果、状态变化、文件副作用、退出码及后续动作。授权过期、候选/文件漂移和跨工作区冲突仍被识别，拒绝后的恢复路径仍可继续使用；必要平台检查缺失不能算通过。
    result: passed
    reason:
      text: Windows 与 Ubuntu 24.04 Linux 的受影响测试已通过；用户明确接受 macOS 环境未执行这一已披露限制，报告不宣称
        macOS 已通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 命令之间或并发执行中的状态、文件、分支/worktree
      变化不会被旧观察结果掩盖；写入和最终提交校验读取最新状态，作用域内复用不会泄漏到另一请求、项目或工作区。
    result: passed
    reason:
      text: 候选没有引入跨请求缓存或旧观察结果复用；Classic 批量 hash 保留输入顺序并在批量失败时逐文件回退，Native 仅从当前 staged
        index 判断 gitlink，定向测试与 diff review 未发现作用域泄漏。
      truncated: false
  - id: A6
    source: brief.md
    text: Skill 优化若发生，不省略有效确认和恢复步骤；Runtime
      已给出充分当前响应时避免重复查询，新会话、上下文缺失和外部变化时仍重新获取必要状态。改动的中文/英文行为一致。
    result: passed
    reason:
      text: 本候选未修改 Skill、确认、锁、验证或恢复协议；变更只在 Runtime 内部摘要和 gitlink 探测，定向回归与生成物检查通过。
      truncated: false
  - id: A7
    source: brief.md
    text: 现有 daemon 开启、关闭、冷启动、热调用及不可用回退均有相应验证，Hook 保持独立可执行。长检查的外部执行时长与 Comet
      自身成本分别报告。
    result: passed
    reason:
      text: Windows daemon benchmark 已覆盖冷启动、热调用、idle 重启和 COMET_DAEMON=off
        fallback；Windows Hook/daemon 相关测试 165 passed、2 skipped，Linux 同组 164
        passed、3 skipped。Hook Router packaged runtime 与 Native/Classic Guard
        测试通过，长检查耗时仍与 Runtime 自身时间分开报告。
      truncated: false
  - id: A8
    source: brief.md
    text: 最终报告分别列出各类命令及代表性完整链路的收益、用户减少的等待、执行过的验证和未执行项；不把 Runtime 局部加速外推成真实
      Agent/模型全程加速。
    result: passed
    reason:
      text: docs/research/2026-09-22-workflow-cli-performance-results.md 已列出全部 20
        个场景的前后中位数、P95、调用数、收益及未改善项，并明确不外推 Agent/模型全程收益。
      truncated: false
