    source: brief.md
    text:
      A5：用户补充或修正来源后，Decisions、覆盖映射、完整目标 Spec 和验收条件同步更新；旧语义标为 `superseded`
      并指向替代单元，当前 Spec 只表达最新确认语义。
    result: passed
