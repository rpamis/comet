      truncated: false
  - id: A22
    source: specs/memory-workflow-integration/spec.md
    text: Bridge 必须把解析出的项目语言写入 lifecycle payload；Personal Memory 插件从 payload 构造
      `MemoryObservation` 时必须保留语言和
      `candidateKey`。中文配置下自动记录的类别和摘要必须通过中文语言约束，英文配置下通过英文语言约束。缺失配置回退 `zh-CN`。
    result: passed
    reason:
      text: language 和 candidateKey 端到端保持并受服务层语言约束。
      truncated: false
