      truncated: false
  - id: A18
    source: specs/memory-workflow-integration/spec.md
    text: 工作流自动观察必须选择当前项目作用域并只 dispatch 一次 Personal Memory
      观察。一次事件不得同时生成全局和项目两份记忆；跨项目的个人偏好只能由显式用户操作产生。Project Rules
      现有上下文收集和能力调用语义必须保持不变。
    result: passed
    reason:
      text: 自动生命周期只 dispatch 当前项目作用域，Project Rules 语义保持。
      truncated: false
  - id: A19
    source: specs/memory-workflow-integration/spec.md
    text: "**当** 一个成功检查点被 dispatch"
    result: passed
    reason:
      text: 单个成功检查点只执行一次项目作用域 dispatch。
      truncated: false
  - id: A20
    source: specs/memory-workflow-integration/spec.md
    text: "**那么** Personal Memory 最多接收一条对应项目观察"
    result: passed
    reason:
      text: Personal Memory 只接收对应项目观察。
