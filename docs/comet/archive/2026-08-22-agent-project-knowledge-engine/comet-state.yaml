      Project Knowledge 与 Personal Memory 是两个独立贡献：Personal Memory 保存当前用户的
      global/project 偏好和个人经验，Project Knowledge
      保存有当前项目来源支持的工程知识。两者可以并行召回，但不共用存储、状态、预算和管理动作，也不自动互相复制。
    result: passed
