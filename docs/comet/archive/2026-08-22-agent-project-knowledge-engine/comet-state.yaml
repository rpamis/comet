  - id: A49
    source: specs/project-knowledge/spec.md
    text: "端到端使用场景 #### 长中文任务
      任务同时包含中文描述、`SQLite`、`ripgrep`、路径和错误码。查询规划先保留强标识符与完整中文短语，再分配弱片段；hybrid 返回当前
      Spec 和相关项目知识单元，不因弱片段提前占满预算而丢失强锚点。 #### 单文件发生变化 一个 Spec
      文件被修改。任务入口只读取该文件，比较并更新有差异的 section；其他 SQLite 内容继续召回。更新完成前，该文件由限定范围 ripgrep
      提供当前内容，不重新扫描或复制全部语料。 #### 项目作用域个人偏好 用户只在 Comet 项目采用“先确认中文语义，再同步英文”。该偏好保存在
      project Personal Memory 并在当前项目自动召回，不写入共享项目知识，也不对其他贡献者生效。 #### 共享个人项目经验
      用户明确要求把一次已验证经验共享给团队。系统去除个人信息，打开当前来源核对结论，形成 draft 项目知识单元；用户确认后才写入
      `docs/comet/knowledge/units/`。 #### 失败回退 SQLite 文件损坏或当前 Node 未提供
      FTS5。Local 给出有界诊断并使用现有 ripgrep 路径，workflow 继续；不会把本地正文发送到 Remote。"
