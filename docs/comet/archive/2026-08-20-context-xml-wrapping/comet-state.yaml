    source: specs/context-injection/spec.md
    text: 固定标签本身不接受用户输入，不能被正文内容闭合或改变。
    result: passed
    reason:
      text: Tag names come only from fixed constants and escaped body text cannot
        close or create a wrapper element.
      truncated: false
  - id: A20
    source: specs/context-injection/spec.md
    text: 如果已知插件贡献的正文为空或仅包含空白字符，保持该贡献为空文本并且不输出空标签。插件桥或单个 Provider
      出错时继续使用现有非阻塞路径；本规格不改变诊断、配置或错误处理。
    result: passed
    reason:
      text: Whitespace-only known text produces no wrapper, while existing Provider
        errors remain handled by the unchanged non-blocking bridge path.
      truncated: false
  - id: A21
    source: specs/context-injection/spec.md
    text: Personal Memory 的检索开关、Project Knowledge 的 Local/Remote
      配置、召回上限、排序、来源引用、Dashboard 页面和插件生命周期均保持既有行为。调用方仍接收原有贡献数组结构，只是两个已知插件的 `text`
      字段增加稳定 XML 外层。
    result: passed
    reason:
      text: Memory settings, Local/Remote configuration, limits, ordering, citations,
        Dashboard, lifecycle, and returned array shape remain unchanged apart
        from known text wrappers.
      truncated: false
