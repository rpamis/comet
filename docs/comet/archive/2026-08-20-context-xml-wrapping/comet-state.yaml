    source: specs/context-injection/spec.md
    text: "**Given** 个人记忆插件返回非空正文，**When** 任务收集插件上下文，**Then** 该正文恰好被一个
      `<personal_memory>` 根元素包裹，正文内容和顺序不变。"
    result: passed
    reason:
      text: A1 behavior is directly covered by the focused Entry boundary test.
      truncated: false
  - id: A23
    source: specs/context-injection/spec.md
    text: "**Given** 项目知识插件返回非空正文，**When** 任务收集插件上下文，**Then** 该正文恰好被一个
      `<project_knowledge>` 根元素包裹，来源引用和换行不丢失。"
    result: passed
    reason:
      text: A2 behavior is directly covered by the focused Entry boundary test.
      truncated: false
  - id: A24
    source: specs/context-injection/spec.md
    text: "**Given** 任一已知插件正文包含 `&`、`<`、`>`、`\"` 或 `'`，**When** 生成注入文本，**Then**
      这些字符分别输出为 `&amp;`、`&lt;`、`&gt;`、`&quot;` 和 `&apos;`，且正文不能注入新的 XML 元素。"
    result: passed
    reason:
      text: A3 behavior is directly covered by the focused Entry boundary test and
        full Vitest passed.
      truncated: false
  - id: A25
    source: specs/context-injection/spec.md
    text: "**Given** 已知插件返回空白正文或未知插件返回文本，**When** 生成注入文本，**Then**
      已知空白贡献不产生空标签，未知插件保持原文，贡献数组数量和顺序不变。"
    result: passed
    reason:
      text: A4 behavior is directly covered by the focused Entry boundary test.
      truncated: false
  - id: A26
    source: specs/context-injection/spec.md
    text: "**Given** 个人记忆或项目知识的配置、召回和失败路径，**When** 任务收集上下文，**Then**
