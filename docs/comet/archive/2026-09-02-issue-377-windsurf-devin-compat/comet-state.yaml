acceptance:
  - id: A1
    source: brief.md
    text: "A1: OpenSpec 1.11 通过 `--tools windsurf` 生成 `.devin/` 时，Comet project
      init/update 成功，并把 OpenSpec 文件写入 `<project>/.devin/`。"
    result: passed
    reason:
      text: OpenSpec current .devin output is accepted and project install/update
        regression coverage passes.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 旧版 OpenSpec 生成 `.windsurf/` 时，Comet project/global init/update
      仍成功；project staged output 会写入 canonical `.devin/`，global 旧目录仍能被识别和更新。"
    result: passed
    reason:
      text: Legacy .windsurf OpenSpec output remains supported; project staging
        normalizes to .devin and global legacy output remains usable.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 已有 `.windsurf/` 的项目仍能被识别为 `windsurf`，Comet 可以读取其中的 managed
      Skills；卸载可以清理 Comet-managed files，但不删除用户文件。"
    result: passed
    reason:
      text: Legacy .windsurf detection, managed Skill inspection, update, uninstall,
        and user-file preservation are covered by the existing and added tests.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: `comet init` 默认创建 `.devin/`；Native snapshot 默认排除
      `.devin/skills/**`，同时保留 `.windsurf/skills/**` 对旧安装的兼容。"
    result: passed
    reason:
      text: New init output uses .devin and Native defaults exclude both current and
        legacy Skill roots.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: `--platform windsurf`、已有 Superpowers 映射和 Windsurf Hook 映射继续有效，不需要新的
      `devin` 平台参数。"
    result: passed
    reason:
      text: The windsurf platform and existing Superpowers/Hook mappings remain stable
        without a devin selector.
      truncated: false
  - id: A6
    source: specs/windsurf-devin-compat/spec.md
    text: Existing Windsurf selection remains valid - **Given** a user selects
      `--platform windsurf` - **When** Comet resolves platform, Superpowers, or
      Hook mappings - **Then** the selection resolves to the existing Windsurf
      platform - **And** no `devin` platform ID is required
    result: passed
    reason:
      text: The existing windsurf platform identity and selector remain unchanged.
      truncated: false
  - id: A7
    source: specs/windsurf-devin-compat/spec.md
    text: Current OpenSpec output is installed - **Given** OpenSpec generates the
      Windsurf-compatible tool output under `.devin/` - **When** Comet installs
      OpenSpec tools for a project or globally - **Then** the generated files
      are available under the canonical `.devin/` root - **And** a second
      canonical copy is not required under `.windsurf/`
    result: passed
    reason:
      text: Current OpenSpec output is copied to canonical .devin without requiring a
        duplicate .windsurf copy.
      truncated: false
  - id: A8
    source: specs/windsurf-devin-compat/spec.md
    text: Legacy installation is detected and maintained - **Given** a project has
      Comet-managed Skills under `.windsurf/` and no `.devin/` root - **When**
      Comet detects, updates, or uninstalls the Windsurf installation - **Then**
      it recognizes the installation as `windsurf` - **And** it can operate on
      Comet-managed files under `.windsurf/` - **And** it does not delete
      unrelated user files
    result: passed
    reason:
      text: Legacy .windsurf installations are detected and managed without deleting
        unrelated files.
      truncated: false
  - id: A9
    source: specs/windsurf-devin-compat/spec.md
    text: Legacy staged output is normalized for a project - **Given** an older
      OpenSpec CLI stages Windsurf output under `.windsurf/` - **When** Comet
      installs OpenSpec tools for a project - **Then** the install succeeds -
      **And** the staged files are copied to `<project>/.devin/` - **And** no
      generated file is required to remain under `<project>/.windsurf/`
    result: passed
    reason:
      text: Legacy staged OpenSpec output is accepted and normalized to the project
        .devin root.
      truncated: false
  - id: A10
    source: specs/windsurf-devin-compat/spec.md
    text: Both staged layouts exist - **Given** a staged project contains non-empty
      output under both `.devin/` and `.windsurf/` - **When** Comet resolves the
      generated Windsurf output - **Then** it chooses `.devin/` as the current
      output - **And** it does not silently merge an ambiguous legacy tree over
      the current output
    result: passed
    reason:
      text: When both staged layouts exist, .devin is preferred and the legacy tree is
        not silently merged.
      truncated: false
  - id: A11
    source: specs/windsurf-devin-compat/spec.md
    text: Snapshot excludes current and legacy Skill roots - **Given** a project
      contains managed Skills in either Windsurf root - **When** Comet creates
      the default Native snapshot configuration - **Then** both
      `.devin/skills/**` and `.windsurf/skills/**` are excluded
    result: passed
    reason:
      text: Native snapshot defaults exclude both .devin/skills/** and
        .windsurf/skills/**.
      truncated: false
