acceptance:
  - id: A1
    source: brief.md
    text: 用户只在 Comet Skill 中完成一个普通任务时，任务开始能得到个人画像和当前项目相关的规则片段；任务结束自动记录成功结果，且不会要求用户打开
      Dashboard 或手动执行 CLI。
    result: failed
    reason:
      text: collectCometPluginContext 只有定义，没有接入普通 Skill 或 workflow 开始路径；Skill 文本要求模型运行
        CLI，不能证明宿主自动注入。
      truncated: false
  - id: A2
    source: brief.md
    text: Native、Classic、Hotfix、Tweak
      的成功完成、验证和归档都产生有来源的生命周期事件；个人记忆和项目规则分别消费事件，不把个人偏好写成团队规则。
    result: failed
    reason:
      text: Native 仅记录 next/archive/handoff，Classic 仅记录 archive/handoff/workspace 且固定
        full；verification、Hotfix、Tweak 和完整生命周期没有统一有来源事件。
      truncated: false
  - id: A3
    source: brief.md
    text: 用户关闭个人记忆学习/检索或暂停某个项目后，项目规则和基础 workflow 仍工作；停用项目规则后，个人记忆和基础 workflow
      仍工作；卸载只移除入口，不删除已有数据或仓库规则。
    result: passed
    reason:
      text: 插件 Runtime 的停用、项目暂停、卸载数据保留和基础 workflow 隔离已有实现与测试。
      truncated: false
  - id: A4
    source: brief.md
    text: 个人记忆存储在专用 Git repository；完成节点自动提交并按配置同步，另一会话、设备、同仓库 worktree 或重新克隆可以通过稳定
      project identity 读取相同内容。
    result: passed
    reason:
      text: 默认 bridge 使用独立 memory repository、GitMemorySync 和稳定 project
        identity；checkpoint sync 失败不会阻塞 workflow。
      truncated: false
  - id: A5
    source: brief.md
    text: 项目规则上下文按任务、目标路径和验证阶段路由，固定保守上限；没有 Hook 时由 Skill 使用同一 selector，不复制整份规则到宿主配置。
    result: failed
    reason:
      text: selector 只按任务和路径选择，没有验证阶段参数；Hook/Skill 虽有文本约定，但没有统一可调用的阶段路由。
      truncated: false
  - id: A6
    source: brief.md
    text: 两次独立成功任务形成同一规则候选后，Skill 在任务结束只显示一条可读摘要；用户可以一次加入、忽略或稍后，不创建规则专用 Comet change。
    result: failed
    reason:
      text: 候选读取和用户操作仍只是 Skill 文本约定，没有宿主侧一次摘要、加入/忽略/稍后编排。
      truncated: false
  - id: A7
    source: brief.md
    text: 用户明确添加规则时，若已有可用 linter、测试、编译器、构建插件或 CI，Comet
      生成/定位对应原生配置或测试改动；无法确定性检查的要求写入最相关的 Agent 指令或普通 Markdown 规则。
    result: failed
    reason:
      text: proposeCarrier 能识别验证入口，但 adoptCandidate 在该分支仍写入 .comet/rules，没有生成或定位
        linter、测试、编译器、插件或 CI 的原生配置改动。
      truncated: false
  - id: A8
    source: brief.md
    text: Agent 修改代码后，项目规则服务能够运行实际可用的仓库验证入口；只有命令失败才进入修复循环，warning 且命令成功不被误报为阻塞。
    result: failed
    reason:
      text: rules verify 只执行首个验证命令并返回结果，没有宿主驱动的失败诊断到 Agent 修复再验证循环。
      truncated: false
  - id: A9
    source: brief.md
    text: Dashboard、Skill 和 CLI 调用同一插件 runtime、service、状态和存储；Dashboard 失效时 Skill/CLI
      仍可完成上下文、候选、规则和记忆操作。
    result: passed
    reason:
      text: Dashboard、Skill fallback 和 CLI 使用同一 bridge/runtime/service 边界；插件 API
        与状态隔离测试通过。
      truncated: false
  - id: A10
    source: brief.md
    text: 缺少或失败的一个插件只产生带插件标识的诊断，健康插件和基础 workflow 继续运行；相关集成测试覆盖跨项目、跨插件和旧请求不回写。
    result: passed
    reason:
      text: 插件失败捕获、健康插件继续运行、跨项目/插件状态隔离和旧请求防护已有覆盖；剩余宿主接线缺口已在 A1/A2/A5/A6 标出。
      truncated: false
