acceptance:
  - id: A1
    source: brief.md
    text: 用户只在 Comet Skill 中完成一个普通任务时，任务开始能得到个人画像和当前项目相关的规则片段；任务结束自动记录成功结果，且不会要求用户打开
      Dashboard 或手动执行 CLI。
    result: passed
    reason:
      text: /comet resolver 将原请求传给 workflow resolve --task；Native/Classic/Hotfix/Tweak
        Skill 通过公开 comet task 与工作流 facade 使用同一 bridge，Skill fallback 可在无
        Hook/Dashboard 时完成开始上下文和结束 checkpoint。
      truncated: false
  - id: A2
    source: brief.md
    text: Native、Classic、Hotfix、Tweak
      的成功完成、验证和归档都产生有来源的生命周期事件；个人记忆和项目规则分别消费事件，不把个人偏好写成团队规则。
    result: passed
    reason:
      text: Native facade 支持 next/archive/check/handoff 生命周期映射，Native check
        已注册；Classic facade 支持 state/guard/handoff/archive/workspace，并从 change
        state 读取 full/hotfix/tweak；dispatchLifecycle 携带
        workflow/changeId/source，memory/rules 各自消费。
      truncated: false
  - id: A3
    source: brief.md
    text: 用户关闭个人记忆学习/检索或暂停某个项目后，项目规则和基础 workflow 仍工作；停用项目规则后，个人记忆和基础 workflow
      仍工作；卸载只移除入口，不删除已有数据或仓库规则。
    result: failed
    reason:
      text: 普通任务的 cometTaskCommand --complete 未隔离项目规则插件：直接 await
        collectCometProjectRuleCandidates；规则插件被停用/缺失时 runtime.invoke
        抛错，任务完成命令失败，不能保证基础 workflow 继续。
      truncated: false
  - id: A4
    source: brief.md
    text: 个人记忆存储在专用 Git repository；完成节点自动提交并按配置同步，另一会话、设备、同仓库 worktree 或重新克隆可以通过稳定
      project identity 读取相同内容。
    result: passed
    reason:
      text: 既有 FileMemoryRepository + GitMemorySync 专用仓库、稳定 project identity 与完成节点
        sync 逻辑保留；相关测试/本轮未见回归。
      truncated: false
  - id: A5
    source: brief.md
    text: 项目规则上下文按任务、目标路径和验证阶段路由，固定保守上限；没有 Hook 时由 Skill 使用同一 selector，不复制整份规则到宿主配置。
    result: passed
    reason:
      text: 公开 context/selector 透传 task/path/phase，project-rules plugin 将 stage 传入
        selector；固定 maxSections=5/maxBytes=8KiB；Skill fallback 与 CLI 共用
        bridge，不全量复制规则。
      truncated: false
  - id: A6
    source: brief.md
    text: 两次独立成功任务形成同一规则候选后，Skill 在任务结束只显示一条可读摘要；用户可以一次加入、忽略或稍后，不创建规则专用 Comet change。
    result: failed
    reason:
      text: comet task 返回候选摘要和操作，但 Native/Classic facade 在每个成功命令后都
        emitCandidates，不限于任务结束，可能重复显示；普通 task action 需另发 rules
        action，未形成一次任务结束编排。
      truncated: false
  - id: A7
    source: brief.md
    text: 用户明确添加规则时，若已有可用 linter、测试、编译器、构建插件或 CI，Comet
      生成/定位对应原生配置或测试改动；无法确定性检查的要求写入最相关的 Agent 指令或普通 Markdown 规则。
    result: failed
    reason:
      text: 已有 package/Maven/Gradle 等验证入口时 adoptCandidate 仅写
        .comet/rules/proposals/<entrypoint>.md 提案；该 proposals 子目录不被 readSources
        选择，也未生成/修改原生 linter/test/build 配置，采用后规则不会实际约束。
      truncated: false
  - id: A8
    source: brief.md
    text: Agent 修改代码后，项目规则服务能够运行实际可用的仓库验证入口；只有命令失败才进入修复循环，warning 且命令成功不被误报为阻塞。
    result: failed
    reason:
      text: 默认 CLI/Dashboard bridge 未提供
        repairProjectRules/runProjectRuleVerification；rules verify 即使
        --max-attempts=3 失败也不会调用 Agent 修复再验证，只有测试显式注入 callback 才闭环。
      truncated: false
  - id: A9
    source: brief.md
    text: Dashboard、Skill 和 CLI 调用同一插件 runtime、service、状态和存储；Dashboard 失效时 Skill/CLI
      仍可完成上下文、候选、规则和记忆操作。
    result: passed
    reason:
      text: Dashboard default host、Skill/CLI 均通过 createDefaultCometPluginBridge 使用同一
        plugin runtime/service/storage；已有 Dashboard/插件隔离测试通过。
      truncated: false
  - id: A10
    source: brief.md
    text: 缺少或失败的一个插件只产生带插件标识的诊断，健康插件和基础 workflow 继续运行；相关集成测试覆盖跨项目、跨插件和旧请求不回写。
    result: failed
    reason:
      text: 普通 comet task 的候选调用未 try/catch，项目规则插件 missing/failure 会阻断任务完成；虽 runtime 的
        context/event 有诊断隔离，公共 task host 仍违反单插件失败不阻断基础 workflow。
      truncated: false
