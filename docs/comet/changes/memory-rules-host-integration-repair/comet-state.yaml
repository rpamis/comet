acceptance:
  - id: A1
    source: brief.md
    text: 用户只在 Comet Skill 中完成一个普通任务时，任务开始能得到个人画像和当前项目相关的规则片段；任务结束自动记录成功结果，且不会要求用户打开
      Dashboard 或手动执行 CLI。
    result: failed
    reason:
      text: 普通 Skill 仍依赖 Skill 文本让 Agent 手动运行 comet memory
        context；没有普通任务宿主入口自动收集上下文或自动记录成功结果。Native/Classic facade 只有在显式传入
        --comet-task 时才接线。
      truncated: false
  - id: A2
    source: brief.md
    text: Native、Classic、Hotfix、Tweak
      的成功完成、验证和归档都产生有来源的生命周期事件；个人记忆和项目规则分别消费事件，不把个人偏好写成团队规则。
    result: failed
    reason:
      text: Personal Memory 仅订阅 change.completed、task.completed、memory.observe，未消费
        verification.completed/review.completed；Native facade 的 check 也未注册到
        native-cli。Classic 默认 workflow 固定为 full，Hotfix/Tweak 只有显式
        --comet-workflow 才能归类，且事件记录使用 process.cwd() 而非解析后的 projectRoot。
      truncated: false
  - id: A3
    source: brief.md
    text: 用户关闭个人记忆学习/检索或暂停某个项目后，项目规则和基础 workflow 仍工作；停用项目规则后，个人记忆和基础 workflow
      仍工作；卸载只移除入口，不删除已有数据或仓库规则。
    result: passed
    reason:
      text: 插件 Runtime 的停用、项目暂停、卸载数据保留和基础 workflow 隔离保持有效；相关集成测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: 个人记忆存储在专用 Git repository；完成节点自动提交并按配置同步，另一会话、设备、同仓库 worktree 或重新克隆可以通过稳定
      project identity 读取相同内容。
    result: passed
    reason:
      text: 默认 bridge 使用独立 Git memory repository、稳定 project identity，并在 lifecycle
        dispatch 后尝试 sync；同步失败被隔离，不阻塞 workflow。集成测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 项目规则上下文按任务、目标路径和验证阶段路由，固定保守上限；没有 Hook 时由 Skill 使用同一 selector，不复制整份规则到宿主配置。
    result: failed
    reason:
      text: 底层 service 和 provideContext 支持 stage，但普通 Skill 的 comet memory context CLI
        没有 phase 选项；project-rules plugin 的 select capability 还丢弃 stage，导致
        CLI/fallback 路径不能保证按验证阶段使用同一 selector。
      truncated: false
  - id: A6
    source: brief.md
    text: 两次独立成功任务形成同一规则候选后，Skill 在任务结束只显示一条可读摘要；用户可以一次加入、忽略或稍后，不创建规则专用 Comet change。
    result: failed
    reason:
      text: candidateEnvelope 只返回摘要和操作名，facade 仅在每个成功 workflow
        命令后打印摘要，没有任务结束的一次性编排，也没有 Skill 对 adopt/ignore/snooze（文本写作 defer）的用户回复处理。
      truncated: false
  - id: A7
    source: brief.md
    text: 用户明确添加规则时，若已有可用 linter、测试、编译器、构建插件或 CI，Comet
      生成/定位对应原生配置或测试改动；无法确定性检查的要求写入最相关的 Agent 指令或普通 Markdown 规则。
    result: failed
    reason:
      text: 虽然能发现 package/Maven/Gradle 等验证入口，但 adoptCandidate 在已有验证入口时仍把候选追加到
        AGENTS.md（附验证入口说明），没有生成或定位对应原生配置、测试或构建插件改动。
      truncated: false
  - id: A8
    source: brief.md
    text: Agent 修改代码后，项目规则服务能够运行实际可用的仓库验证入口；只有命令失败才进入修复循环，warning 且命令成功不被误报为阻塞。
    result: failed
    reason:
      text: verify 的 repairVerification 只是可选 service 注入；默认 bridge/plugin
        未提供该回调，--max-attempts 只会重复执行命令，失败诊断没有宿主驱动的修复再验证闭环。
      truncated: false
  - id: A9
    source: brief.md
    text: Dashboard、Skill 和 CLI 调用同一插件 runtime、service、状态和存储；Dashboard 失效时 Skill/CLI
      仍可完成上下文、候选、规则和记忆操作。
    result: passed
    reason:
      text: Dashboard、CLI 和 Skill fallback 仍通过公开 plugin bridge/runtime/service
        边界访问共享状态；目标集成测试通过。
      truncated: false
  - id: A10
    source: brief.md
    text: 缺少或失败的一个插件只产生带插件标识的诊断，健康插件和基础 workflow 继续运行；相关集成测试覆盖跨项目、跨插件和旧请求不回写。
    result: passed
    reason:
      text: PluginRuntime 对缺失、停用和执行失败插件提供带 pluginId 的诊断并隔离失败，健康插件和基础 workflow
        继续运行；相关测试通过。
      truncated: false
