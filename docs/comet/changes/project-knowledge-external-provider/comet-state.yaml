  - id: A14
    source: specs/project-knowledge/spec.md
    text: "`comet.project-knowledge` is a project-scoped first-party capability for
      source-backed understanding of the current project. It can provide bounded
      context through the existing task context bridge and can be queried or
      managed through the CLI and Dashboard."
    result: pending
    reason: null
  - id: A15
    source: specs/project-knowledge/spec.md
    text: "Project Knowledge records describe the project itself: structure, module
      responsibilities, verified behavior, integration paths, change impact, and
      build/test practices. They are evidence only. Current source,
      configuration, tests, workflow state, user requests, system constraints,
      and Skills remain authoritative."
    result: pending
    reason: null
  - id: A16
    source: specs/project-knowledge/spec.md
    text: Personal Memory is a separate capability. It stores user facts,
      preferences, collaboration habits, and personal project experience. It has
      separate storage, provider configuration, retrieval budget, context block,
      and management actions. Personal Memory records are never copied into
      Project Knowledge automatically.
    result: pending
    reason: null
  - id: A17
    source: specs/project-knowledge/spec.md
    text: "The project configuration keeps the existing shape:"
    result: pending
    reason: null
  - id: A18
    source: specs/project-knowledge/spec.md
    text: "`local` is the default. Local data belongs to the current user and is
      stored outside the project. `remote` is optional for team sharing and uses
      the configured endpoint, token environment-variable name, scope, and
      timeout. Local and Remote are strictly mutually exclusive for a request.
      Remote failure never reads Local as a fallback and never silently switches
      providers."
    result: pending
    reason: null
  - id: A19
    source: specs/project-knowledge/spec.md
    text: The Dashboard may update the project `knowledge` block through the
      existing workflow-project configuration writer. It may display only the
      token environment-variable name and whether that environment variable is
      present; token values and Authorization headers never enter page data.
    result: pending
    reason: null
  - id: A20
    source: specs/project-knowledge/spec.md
    text: "The internal object is a `ProjectKnowledgeRecord`:"
    result: pending
    reason: null
