      `rebuild` refreshes the current Local workspace projection and asks the
      selected Provider to refresh Records. There are no `knowledge units`,
      `share`, `share-memory`, or project-file export commands."
    result: pending
    reason: null
  - id: A51
    source: specs/project-knowledge/spec.md
    text: "The Dashboard provides the same management actions through the Plugin
