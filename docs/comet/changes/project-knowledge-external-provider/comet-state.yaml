  - id: A28
    source: specs/project-knowledge/spec.md
    text: The product does not expose `unit`, `origin`, `maintained`, `generated`,
      or `draft` terminology. Records are stored in the user's data directory.
      No Project Knowledge Markdown file or database file is created in the
      project directory.
    result: pending
    reason: null
  - id: A29
    source: specs/project-knowledge/spec.md
    text: "The domain depends on one provider contract:"
    result: pending
    reason: null
  - id: A30
    source: specs/project-knowledge/spec.md
    text: "`query` supports bounded search, list, and get requests. `apply` supports
      `upsert`, `correct`, `retire`, and `refresh`."
    result: pending
    reason: null
  - id: A31
    source: specs/project-knowledge/spec.md
    text: All callers use this contract. The CLI, Dashboard, context bridge,
      learning service, and Plugin Runtime do not access Local SQLite tables or
      Remote HTTP directly.
    result: pending
    reason: null
  - id: A32
    source: specs/project-knowledge/spec.md
    text: "Local Provider uses a repository-level SQLite database under the user's
      data directory. The stable repository ID is the authority boundary: the
      main checkout and linked worktrees of the same repository share Records.
      The workspace ID partitions source documents, sections, and FTS
      projections so branch contents are not mixed."
    result: pending
    reason: null
  - id: A33
    source: specs/project-knowledge/spec.md
    text: The database contains the authoritative Record tables and a rebuildable
      workspace section/FTS projection. It uses WAL, short transactions, a
      bounded busy timeout, and existing source-read limits. A missing or
      corrupt projection can be rebuilt without deleting valid Records. A
      structure mismatch is rebuilt because this capability is not released and
      has no legacy schema migration requirement.
    result: pending
    reason: null
  - id: A34
    source: specs/project-knowledge/spec.md
    text: "Local query behavior is:"
    result: pending
    reason: null
  - id: A35
    source: specs/project-knowledge/spec.md
    text: Build the bounded query from task, path, phase, and operation.
    result: pending
    reason: null
  - id: A36
    source: specs/project-knowledge/spec.md
    text: Refresh changed corpus sources for the current workspace within the
      existing time budget.
    result: pending
    reason: null
  - id: A37
    source: specs/project-knowledge/spec.md
    text: Search active Records, section FTS, and bounded ripgrep fallback.
    result: pending
    reason: null
  - id: A38
    source: specs/project-knowledge/spec.md
    text: Fuse candidates deterministically, apply path/source/type relevance, and
      expand only sourced one-hop relations from already matched Records.
    result: pending
    reason: null
  - id: A39
    source: specs/project-knowledge/spec.md
    text: Revalidate every Record source before returning it.
    result: pending
    reason: null
  - id: A40
    source: specs/project-knowledge/spec.md
    text: Return only active, current, source-backed results and bounded diagnostics.
    result: pending
    reason: null
  - id: A41
    source: specs/project-knowledge/spec.md
    text: If a source, anchor, or source fingerprint is no longer valid, the Record
      becomes `needs-review` and is excluded from the current context. A
      user-authority Record keeps its corrected text but also stops being
      injected until its sources are current again.
    result: pending
    reason: null
  - id: A42
    source: specs/project-knowledge/spec.md
    text: Remote uses `comet.project-knowledge.provider.v1`. `status`, `query`, and
      `apply` are operations on the configured endpoint. The envelope includes
      the operation, configured scope, stable project ID, and bounded operation
      input.
    result: pending
    reason: null
  - id: A43
    source: specs/project-knowledge/spec.md
    text: Remote query input may contain task text, project-relative path, phase,
      operation, result limit, or a bounded list/get selector. Remote apply
      input may contain Record conclusions, project-relative sources, applicable
      paths, and verification data. It must not contain a complete transcript,
      full diff, command log, credential, token value, or whole repository.
    result: pending
    reason: null
  - id: A44
    source: specs/project-knowledge/spec.md
    text: Invalid responses, timeouts, non-success responses, and response-size
      violations return an empty result or failed apply with a bounded
      diagnostic. They never query Local or disclose Local project content to
      Remote.
    result: pending
    reason: null
  - id: A45
    source: specs/project-knowledge/spec.md
    text: The workflow sends bounded `verification.completed`, `change.completed`,
      and structured `task.completed` events containing changed paths, artifact
      references, verification commands/results, and success state. Full chat,
      diff, logs, and command output are not persisted.
    result: pending
    reason: null
  - id: A46
    source: specs/project-knowledge/spec.md
    text: Deterministic extraction and an optional semantic reviewer produce Record
      mutations. Every reported verification result must succeed and every
      conclusion source must still validate before an automatic upsert is
      applied. Verified, current automatic Records become `active` immediately;
      Dashboard confirmation is not required.
    result: pending
    reason: null
  - id: A47
    source: specs/project-knowledge/spec.md
    text: Automatic updates with the same semantic identity update an existing
      Record instead of creating duplicates. A retired automatic Record cannot
      be reactivated from the same source versions; a new verified source
      revision may create or update it. Automatic learning may not replace the
      summary or conclusions of a user-authority Record; it may update source
      state and mark the Record for review.
    result: pending
    reason: null
  - id: A48
    source: specs/project-knowledge/spec.md
    text: Learning failures, reviewer failures, and provider failures are
      non-blocking. The previous valid state remains available and the failure
      is reported through bounded diagnostics.
    result: pending
    reason: null
  - id: A49
    source: specs/project-knowledge/spec.md
    text: "The CLI provides:"
    result: pending
    reason: null
  - id: A50
    source: specs/project-knowledge/spec.md
    text: "`correct` makes the user text authoritative and rechecks the existing
      sources. `forget` retires the Record and preserves enough source identity
