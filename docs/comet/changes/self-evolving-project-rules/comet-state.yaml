    reason:
      text: status 摘要不暴露 Runtime 内部字段。
      truncated: false
  - id: A8
    source: specs/project-rules/spec.md
    text: "`domains/project-rules` 提供项目规则文件读取、扫描、候选管理、上下文选择和验证入口发现。它不依赖某一个 Comet
      workflow，也不修改 Native、Classic、Hotfix 或 Tweak
      的状态。`app/commands/project-rules.ts` 只把这些能力暴露为 `comet rules` CLI。"
    result: passed
    reason:
      text: 领域服务与 workflow 状态解耦。
      truncated: false
  - id: A9
    source: specs/project-rules/spec.md
    text: "`.comet/rules/*.md` 是可选的普通 Markdown 文件；一个文件可以写多条规则。"
    result: passed
    reason:
      text: 普通 Markdown 文件可一文件多条规则。
      truncated: false
  - id: A10
    source: specs/project-rules/spec.md
    text: 规则段落可以用标题分组，并可在段落中写 `适用范围：<glob>`；没有范围时按标题、正文、任务和目标路径匹配。
    result: passed
    reason:
