  - id: A15
    source: specs/project-rules/spec.md
    text: "`status` 返回初始化、上次盘点、来源、验证入口和待处理/稍后候选摘要；摘要只包含用户可读文本和处理状态，候选详情按需读取。"
    result: passed
    reason:
      text: 状态和候选公开接口返回可读摘要。
      truncated: false
  - id: A16
    source: specs/project-rules/spec.md
    text: 显式添加的规则立即写入用户指定的普通 Markdown 文件；自动候选只有用户选择加入后才能生成仓库改动。
    result: passed
    reason:
      text: 自动候选只有 adopt 才修改规则文件。
      truncated: false
  - id: A17
    source: specs/project-rules/spec.md
    text: 观察必须带项目身份、workflow 家族、change ID、成功结果和候选键。同一 change 只计一次；至少两个不同且成功的 change
      提供一致证据后才生成非阻塞候选。
    result: failed
    reason:
      text: 旧实现拒绝实际 Classic profile full，且未统一 classic 别名。
      truncated: false
  - id: A18
    source: specs/project-rules/spec.md
    text: 候选可以 `adopt`、`ignore`、`snooze` 或恢复为待处理。未采用候选不进入上下文，不阻塞编译、测试、构建或
      CI，也不静默修改规则来源。
    result: passed
    reason:
      text: 候选支持 adopt/ignore/snooze/restore 且非阻塞。
      truncated: false
  - id: A19
    source: specs/project-rules/spec.md
    text: 选择器先按来源、项目、路径和任务做确定性过滤，再按匹配程度排序；调用者可以缩小但不能放大固定的最大段数和字节数。调用者获得规则文本、来源路径和适用范围，不获得完整候选列表或
      Runtime 机器字段。
    result: passed
    reason:
      text: 过滤排序和固定上下限已覆盖。
      truncated: false
  - id: A20
    source: specs/project-rules/spec.md
    text: 服务从 `package.json` scripts、有效的 Maven/Gradle 构建文件、Makefile、Python 项目配置和可用
