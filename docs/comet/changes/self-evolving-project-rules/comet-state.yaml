    source: brief.md
    text: 用户说“加入规则：迁移必须同步回滚说明”，服务追加到指定 Markdown 文件，已有内容和注释保持不变。
    result: passed
    reason:
      text: 显式添加保留原文并追加规则。
      truncated: false
