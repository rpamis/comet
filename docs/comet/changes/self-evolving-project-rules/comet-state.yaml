    result: passed
    reason:
      text: 原有指令源只读发现不复制。
      truncated: false
  - id: A12
    source: specs/project-rules/spec.md
    text: 写入规则时只能追加或替换明确的目标文件，保留其他文本；初始化和扫描不能生成空规则文件。
    result: passed
    reason:
      text: 写入只作用于明确目标并保留其他文本。
      truncated: false
