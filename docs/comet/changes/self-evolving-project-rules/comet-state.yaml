  - id: A2
    source: brief.md
    text: 在没有规则文件的仓库运行 `comet rules init`，得到盘点摘要并保存 Runtime 状态，但仓库不会出现空规则文件或 Comet
      change。
    result: passed
    reason:
      text: 初始化与扫描保持幂等且只写 Runtime 状态。
      truncated: false
  - id: A3
    source: brief.md
    text: 用户说“加入规则：迁移必须同步回滚说明”，服务追加到指定 Markdown 文件，已有内容和注释保持不变。
    result: passed
    reason:
      text: 显式规则可追加到用户指定的 Markdown 文件并保留已有内容。
      truncated: false
  - id: A4
    source: brief.md
    text: 同一候选只在两个不同且成功的 change 中观察到后才进入待处理候选；重复恢复同一 change 不增加计数。
    result: passed
    reason:
      text: 观察按 workflow/change 去重，两个成功 change 后形成候选。
      truncated: false
  - id: A5
    source: brief.md
    text: "`select` 对任务和目标路径返回相关规则，结果不超过固定字节上限；普通运行不返回整个候选列表。"
    result: failed
    reason:
      text: 选择上限可由调用者任意放大，且无匹配的无范围规则仍可能返回；不满足固定上下文边界。
      truncated: false
  - id: A6
    source: brief.md
    text: 项目含 `package.json`、`pom.xml`、`build.gradle` 或 Makefile
      时，服务返回项目实际可用的验证入口，不要求统一为 Comet 命令。
    result: failed
    reason:
      text: 仅凭 build 文件存在就猜测 mvn/gradle 命令，未确认项目实际验证入口。
      truncated: false
  - id: A7
    source: brief.md
    text: "`comet rules status --json` 返回初始化状态、规则来源、验证入口和候选摘要；不暴露内部 Runtime 字段。"
    result: failed
    reason:
      text: CLI --json 直接暴露 candidate id/key、观察次数和时间戳等 Runtime 内部字段。
      truncated: false
  - id: A8
    source: specs/project-rules/spec.md
    text: "`domains/project-rules` 提供项目规则文件读取、扫描、候选管理、上下文选择和验证入口发现。它不依赖某一个 Comet
      workflow，也不修改 Native、Classic、Hotfix 或 Tweak
      的状态。`app/commands/project-rules.ts` 只把这些能力暴露为 `comet rules` CLI。"
    result: passed
    reason:
      text: 未采用候选不进入公开选择结果，也不阻塞项目检查。
      truncated: false
  - id: A9
    source: specs/project-rules/spec.md
    text: "`.comet/rules/*.md` 是可选的普通 Markdown 文件；一个文件可以写多条规则。"
    result: passed
    reason:
      text: 来源、任务和路径选择返回用户可读规则文本。
      truncated: false
  - id: A10
    source: specs/project-rules/spec.md
    text: 规则段落可以用标题分组，并可在段落中写 `适用范围：<glob>`；没有范围时按标题、正文、任务和目标路径匹配。
    result: failed
    reason:
      text: "** glob 会被后续 * 替换破坏，深层路径匹配失败；无范围零相关段落也会入选。"
      truncated: false
  - id: A11
    source: specs/project-rules/spec.md
    text: 扫描还可以识别仓库已有的 `AGENTS.md`、`CLAUDE.md`、`.github/copilot-instructions.md`
      等指令来源，但不把它们复制到 `.comet/rules`。
    result: passed
    reason:
      text: 验证入口发现覆盖 package scripts、Maven、Gradle、Makefile 和 Python 配置。
      truncated: false
  - id: A12
    source: specs/project-rules/spec.md
    text: 写入规则时只能追加或替换明确的目标文件，保留其他文本；初始化和扫描不能生成空规则文件。
    result: passed
    reason:
      text: 未执行命令、不安装依赖、不重新解释原生工具严重级别。
      truncated: false
  - id: A13
    source: specs/project-rules/spec.md
    text: Runtime 状态位于
      `.comet/runtime/project-rules/`，包括最近扫描、来源索引、观察去重键和候选状态。它不是用户维护界面，也不替代
      Markdown、Agent 指令或原生检查配置。
    result: failed
    reason:
      text: Runtime state 未持久化来源索引，且可通过 runtimeDirectory 指向项目外。
      truncated: false
  - id: A14
    source: specs/project-rules/spec.md
    text: "`init` 和 `scan` 都执行有边界的只读盘点，并更新 Runtime 状态；两者幂等且不创建 Comet change。"
    result: passed
    reason:
      text: 规则状态位于 .comet/runtime/project-rules，规则来源仍由 Markdown 维护。
      truncated: false
  - id: A15
    source: specs/project-rules/spec.md
    text: "`status` 返回初始化、上次盘点、来源、验证入口和待处理候选摘要。"
    result: failed
    reason:
      text: 公开 candidates/status 返回原始 RuleCandidate，而不是用户可读摘要。
      truncated: false
  - id: A16
    source: specs/project-rules/spec.md
    text: 显式添加的规则立即写入用户指定的普通 Markdown 文件；自动候选只有用户选择加入后才能生成仓库改动。
    result: passed
    reason:
      text: 项目内相对路径检查阻止规则写入项目外。
      truncated: false
  - id: A17
    source: specs/project-rules/spec.md
    text: 观察必须带项目身份、workflow 家族、change ID、成功结果和候选键。同一 change 只计一次；至少两个不同且成功的 change
      提供一致证据后才生成非阻塞候选。
    result: failed
    reason:
      text: 观察没有独立 project identity；成功一致性只信任调用者 candidateKey，且失败后同 change
        成功不能纠正既有失败观察。
      truncated: false
  - id: A18
    source: specs/project-rules/spec.md
    text: 候选可以 `adopt`、`ignore` 或 `snooze`。未采用候选不进入上下文，不阻塞编译、测试、构建或 CI，也不静默修改规则来源。
    result: failed
    reason:
      text: snooze 后候选从公开结果永久消失，没有恢复或到期入口。
      truncated: false
  - id: A19
    source: specs/project-rules/spec.md
    text: 选择器先按来源、项目、路径和任务做确定性过滤，再按匹配程度排序；结果使用固定的最大段数和字节数。调用者获得规则文本、来源路径和适用范围，不获得完整候选列表或
      Runtime 机器字段。
    result: failed
    reason:
      text: 选择器没有来源过滤，零相关规则仍会入选，调用者可以放大上限。
      truncated: false
  - id: A20
    source: specs/project-rules/spec.md
    text: 服务从 `package.json` scripts、Maven/Gradle 构建文件、Makefile、Python
      项目配置等已存在文件中发现验证入口，返回实际命令和来源。它不安装依赖、不运行命令、不改变 warning/error 语义；Agent
      或宿主负责在授权范围内执行并根据原生诊断修复。
    result: failed
    reason:
      text: 空或仅注释的 build.gradle 也返回 gradle check，未识别 wrapper、插件任务和
        lockfile；pytest.ini-only 的 sourcePath 也错误。
      truncated: false
  - id: A21
    source: specs/project-rules/spec.md
    text: 三个命令调用同一领域服务；普通输出简短可读，`--json` 只返回用户需要的状态和摘要，不返回内部 ID、评分或状态机字段。
    result: failed
    reason:
      text: JSON 仍暴露内部 ID/状态，CLI 测试未覆盖 scan 和普通文本输出。
      truncated: false
