name: PR Template

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-template:
    name: PR template
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request template
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const baseSha = context.payload.pull_request?.base?.sha;
            const templateResponse = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/PULL_REQUEST_TEMPLATE.md',
              ref: baseSha,
            });
            if (Array.isArray(templateResponse.data) || !templateResponse.data.content) {
              core.setFailed('Unable to read .github/PULL_REQUEST_TEMPLATE.md.');
              return;
            }

            // Treat PR text only as data. Never checkout or execute the PR head.
            const visibleMarkdown = (value) => {
              let fence;
              return value.replace(/<!--[\s\S]*?(?:-->|$)/g, '').replace(/\r\n/g, '\n')
                .split('\n').map((line) => {
                  const marker = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
                  if (fence) {
                    if (marker && marker[1][0] === fence[0] && marker[1].length >= fence.length && !marker[2].trim()) fence = undefined;
                    return '';
                  }
                  if (marker) { fence = marker[1]; return ''; }
                  return line;
                }).join('\n');
            };
            const template = visibleMarkdown(Buffer.from(templateResponse.data.content, 'base64').toString('utf8'));
            const parseSections = (text) => [...text.matchAll(/^##\s+.+$/gm)].map((match, index, headings) => ({
              heading: match[0].trim(),
              content: text.slice((match.index ?? 0) + match[0].length, headings[index + 1]?.index ?? text.length),
            }));
            const sections = parseSections(template);
            const bodySections = parseSections(visibleMarkdown(body));
            const errors = [];
            for (const section of sections) {
              const matches = bodySections.filter(({ heading }) => heading === section.heading);
              if (matches.length !== 1) errors.push(`Expected exactly one template section: ${section.heading}`);
            }
            const templateItems = sections.flatMap((section) =>
              [...section.content.matchAll(/^- \[[ xX]\] (.+)$/gm)].map((match) => ({
                section: section.heading,
                label: match[1].trim(),
              })),
            );
            const uncheckedChecklistItems = [];
            for (const { section, label } of templateItems) {
              const content = bodySections.find(({ heading }) => heading === section)?.content ?? '';
              const matches = [...content.matchAll(/^- \[([ xX])\] (.+)$/gm)]
                .filter((match) => match[2].trim() === label);
              if (matches.length !== 1) errors.push(`Expected exactly one template item in ${section}: ${label}`);
              if (/checklist/i.test(section) && (matches.length !== 1 || !/[xX]/.test(matches[0][1]))) {
                uncheckedChecklistItems.push(label);
              }
            }
            errors.push(...uncheckedChecklistItems.map((label) => `Checklist item is not checked: ${label}`));
            const checklist = bodySections.find(({ heading }) => heading === '## ✅ Checklist')?.content ?? '';
            const decisions = [...checklist.matchAll(/^Documentation decision: *(.*?) *$/gm)];
            const evidence = [...checklist.matchAll(/^Documentation evidence: *(.*?) *$/gm)];
            if (decisions.length !== 1 || !['updated', 'not-needed'].includes(decisions[0][1])) {
              errors.push('Provide exactly one Documentation decision: updated or not-needed in Checklist.');
            }
            const detail = evidence[0]?.[1] ?? '';
            if (evidence.length !== 1 || detail.length < 20 || /\b(?:TODO|TBD|N\/A|placeholder)\b|explain the affected documentation|<[^>]+>/i.test(detail)) {
              errors.push('Provide exactly one concrete Documentation evidence: naming the updated docs and changes, or explaining why existing guidance needs no update.');
            } else if (decisions[0]?.[1] === 'updated' && !/(?:README(?:-zh)?\.md|CONTRIBUTING\.md|docs\/[^\s`]+\.md)\b/.test(detail)) {
              errors.push('Documentation evidence for updated must name the relevant README, CONTRIBUTING.md, or docs/ Markdown page.');
            }

            const marker = '<!-- comet-pr-template-check -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            const commentBody = errors.length
              ? `${marker}\n## PR template needs attention\n\nPlease update this PR to match the current .github/PULL_REQUEST_TEMPLATE.md:\n\n${errors.map((error) => `- ${error}`).join('\n')}\n`
              : `${marker}\n✅ PR template check passed.\n`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else if (errors.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

            if (errors.length) {
              core.setFailed('Pull request does not satisfy the repository template.');
            }
