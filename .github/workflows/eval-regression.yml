# 真实模型会消耗 API 预算，因此只允许明确手动启动。
name: eval-regression

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'recovery 为 Native/Classic 最高难度各3次；current 为完整16组'
        type: choice
        options:
          - recovery
          - current
        default: recovery
      mode:
        description: 'validate 需要已审核 baseline；首次选 collect，只收集，不发布放行'
        type: choice
        options:
          - validate
          - collect
        default: validate
      count:
        description: '每组样本数；recovery 必须选3，current 可选1至3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '3'
      workers:
        description: '并发样本数；增加并发会提高瞬时 API 用量'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
        default: '2'

permissions:
  contents: read

concurrency:
  group: eval-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep candidate bytes identical across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-candidate-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
  core-regressions:
    needs: [candidate-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Keep candidate bytes identical across platforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: eval/uv.lock
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: uv sync --locked --extra dev --extra langsmith
        working-directory: eval
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: eval-candidate-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
      - name: Keep the shared CLI build newer than checkout metadata
        run: node -e "const fs=require('node:fs');const now=new Date();fs.utimesSync('dist/app/cli/index.js',now,now)"
      - name: Execute this platform's complete core partition
        run: node scripts/lint/core-regressions.mjs --record-platform coverage/core-platform.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-platform-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: coverage/core-platform.json
          if-no-files-found: error
      - name: Preserve original platform reports on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-platform-reports-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: coverage/core-platform.json.reports/
          if-no-files-found: warn
  model-regression:
    needs: [core-regressions]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Keep candidate bytes identical across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: eval/uv.lock
      - name: Install locked Eval dependencies
        working-directory: eval
        run: uv sync --locked
      - name: Verify deterministic gate badcases without models
        working-directory: eval
        run: uv run --locked --no-sync --no-python-downloads python -m pytest -q local/tests/scaffold/test_regression_check.py
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: eval-candidate-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
      - name: Show the complete release matrix
        working-directory: eval
        env:
          EVAL_COUNT: ${{ inputs.count }}
          EVAL_SUITE: ${{ inputs.suite }}
        run: uv run --locked --no-sync --no-python-downloads python local/scripts/regression_check.py --plan --suite "$EVAL_SUITE" --count "$EVAL_COUNT"
      - name: Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-platform-windows-latest-${{ github.sha }}-${{ github.run_attempt }}
          path: coverage/core-platform/windows
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-platform-ubuntu-latest-${{ github.sha }}-${{ github.run_attempt }}
          path: coverage/core-platform/linux
      - name: Run complete current-candidate Eval
        working-directory: eval
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          EVAL_MODE: ${{ inputs.mode }}
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_COUNT: ${{ inputs.count }}
          EVAL_WORKERS: ${{ inputs.workers }}
        run: |
          args=(--suite current --count "$EVAL_COUNT" --workers "$EVAL_WORKERS" --tolerance 0.10)
          if [[ "$EVAL_SUITE" == recovery ]]; then
            args=(--suite recovery --count "$EVAL_COUNT" --workers "$EVAL_WORKERS" --tolerance 0.10 --baseline local/recovery_release_baseline.json)
          fi
          args+=(--core-platform-records ../coverage/core-platform/windows/core-platform.json ../coverage/core-platform/linux/core-platform.json)
          if [[ "$EVAL_MODE" == collect ]]; then
            args+=(--collect-only)
          fi
          uv run --locked --no-sync --no-python-downloads python local/scripts/regression_check.py "${args[@]}"
      - name: Upload complete experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: eval/local/logs/experiments/
          if-no-files-found: warn
