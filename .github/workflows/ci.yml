name: CI

on:
  push:
    branches:
      - master
      - 'beta*'
      - 'release/**'
      - 'hotfix/**'
      - '0*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify generated runtimes are current
        run: pnpm check:generated
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - name: Verify build is deterministic
        run: git diff --exit-code -- assets
      - id: tests
        run: pnpm test:coverage --reporter=default --reporter=json --outputFile.json=coverage/vitest-results.json
      - name: Upload coverage report
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  node-compatibility:
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test

  runtime-smoke:
    name: Runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:native-parallel
      - name: DSH Hook installation and denial regressions
        run: >-
          pnpm exec vitest run
          test/domains/skill/dsh-hooks.test.ts
          test/platform/dsh-profiles.test.ts
          test/domains/comet-entry/hook-adapter.test.ts
          test/domains/comet-entry/hook-router-runtime.test.ts
      - name: Native check process and recovery regressions
        run: >-
          pnpm exec vitest run
          test/platform/process/process-identity.test.ts
          test/domains/comet-native/native-check-registration.test.ts
          test/domains/comet-native/native-supervisor-check-process.test.ts
          test/domains/comet-native/native-supervisor-integration-execution.test.ts
          test/domains/comet-native/native-supervisor-legacy-diagnostics.test.ts
      - run: pnpm test:runtime-smoke

  package-e2e:
    name: Package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Use the real host temporary directory on macOS
        if: matrix.os == 'macos-latest'
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TMPDIR=' + require('node:fs').realpathSync(require('node:os').tmpdir()) + '\n')"
      - name: Use the real host temporary directory on Windows
        if: matrix.os == 'windows-latest'
        run: node -e "const dir=require('node:fs').realpathSync.native(require('node:os').tmpdir()); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TEMP=' + dir + '\nTMP=' + dir + '\n')"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check:sdk-api
      - run: pnpm test:package-e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22.16.0
      - name: Verify package on the minimum supported Node version
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:package-e2e

  eval-static:
    name: Eval static tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: eval/uv.lock
      - run: uv sync --locked --extra dev --extra langsmith
      - run: uv run ruff check local/tests scaffold local/scripts langsmith
      - run: uv run pytest -q local/tests/scaffold local/tests/tasks/test_validation_scripts.py

  dashboard-e2e:
    name: Dashboard browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:dashboard
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm test:dashboard-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: coverage/playwright-report/
          if-no-files-found: ignore

  sdk-api:
    name: SDK API and recovery snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Preserve baseline SDK recovery fixtures
        env:
          SDK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:sdk-fixtures --base "$SDK_BASE_REF"
      - name: Verify committed Runtime assets before building
        run: pnpm check:generated
      - run: pnpm build
      - run: pnpm check:sdk-api

  sdk-contracts:
    name: SDK contracts (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.16.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Use the real host temporary directory on macOS
        if: matrix.os == 'macos-latest'
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TMPDIR=' + require('node:fs').realpathSync(require('node:os').tmpdir()) + '\n')"
      - name: Use the real host temporary directory on Windows
        if: matrix.os == 'windows-latest'
        run: node -e "const dir=require('node:fs').realpathSync.native(require('node:os').tmpdir()); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TEMP=' + dir + '\nTMP=' + dir + '\n')"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Exercise SDK protocol, application lifecycle, Creator and domain adapters
        id: sdk-tests
        run: pnpm test:sdk ${{ matrix.os == 'windows-latest' && '--exclude test/domains/comet-classic/classic-application.test.ts' || '' }} --reporter=default --reporter=json --outputFile.json=coverage/sdk/results.json
      - name: Exercise the Windows Classic lifecycle without competing SDK subprocesses
        id: classic-sdk-tests
        if: matrix.os == 'windows-latest'
        run: pnpm exec vitest run test/domains/comet-classic/classic-application.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json=coverage/sdk/classic-results.json
      - name: Upload SDK test results
        if: always() && steps.sdk-tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: coverage/sdk/
          if-no-files-found: error

  ci-required:
    name: CI required
    if: always()
    needs:
      - workflow-lint
      - quality
      - node-compatibility
      - runtime-smoke
      - package-e2e
      - eval-static
      - dashboard-e2e
      - sdk-api
      - sdk-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          node -e "const jobs=Object.values(JSON.parse(process.env.NEEDS_CONTEXT)); if(jobs.some(({result})=>result!=='success')) { console.error(jobs); process.exit(1); }"
