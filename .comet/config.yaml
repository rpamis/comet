# Comet 使用的配置格式版本，请勿修改此值。
schema: comet.project.v1
# `/comet` 默认进入的工作流；该值也必须出现在 workflows 中。
default_workflow: native
# 此项目启用的工作流，可填写 native、classic 或同时启用两者。
workflows:
  - native
# 是否启用只读的环境感知恢复探针，同时作用于 Native 和 Classic；设为 false 可关闭自动工作流恢复。
# ambient_resume: true | false
ambient_resume: false
# 当前项目的个人记忆自动学习与注入策略。
memory:
  # 是否允许当前项目通过工作流事件自动沉淀新的个人记忆。
  # 可选值：true | false
  learning: true
  # 是否允许当前项目把个人记忆自动注入 Agent 上下文。
  # 可选值：true | false
  retrieval: true
# Native 工作流配置，不会改变 Classic 的状态或行为。
native:
  # Native 规格和 change 的存放根目录；运行时数据始终位于 .comet。
  artifact_root: docs
  # Native 工作流文档使用的产物语言。
  # 可选值：en | zh-CN
  language: zh-CN
  # Native 提问澄清问题的方式：batch 每轮一次提出当前所有可回答的问题（默认），sequential 每轮只问一个。
  # 可选值：batch | sequential
  clarification_mode: batch
  # Native 归档检查成功后自动归档，或等待用户明确确认。
  # 可选值：automatic | required
  archive_confirmation: automatic
  # 同一个已确认验收目标最多允许的 Verify 失败次数；达到上限后停止完成循环。
  max_verify_failures: 5
# Classic 工作流配置，不会改变 Native 的状态或行为。
classic:
  # Classic 产物布局；默认使用 docs，update 检测到根目录 legacy 产物时予以保留。
  # 可选值：legacy | docs
  artifact_layout: docs
  # Classic 工作流文档使用的产物语言。
  # 可选值：en | zh-CN
  language: zh-CN
  # 新建 Classic change 是否启用 beta 上下文压缩。
  # 可选值：off | beta
  context_compression: beta
  # 新建 Classic change 默认使用的审查深度。
  # 可选值：off | standard | thorough
  review_mode: standard
  # Classic 阶段通过后是否自动进入下一阶段。
  # 可选值：true | false
  auto_transition: true
# 普通 Comet 任务使用的项目知识检索 Provider。
knowledge:
  # 项目知识 Provider。
  # 可选值：local | remote
  provider: local
