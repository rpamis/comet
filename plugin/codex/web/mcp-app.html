<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comet Dashboard</title>
    <!-- COMET_MCP_STYLE -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-background-primary, #fff);
        color: var(--color-text-primary, #222);
        font: 14px/1.5 var(--font-sans, system-ui);
      }
      #root {
        width: 100%;
        height: 100%;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      #connection-status,
      #retry {
        margin: 16px;
      }
      #retry {
        font: inherit;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <p id="connection-status" role="status">正在连接 Comet Dashboard…</p>
    <button id="retry" hidden>重新连接</button>
    <div id="root" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <!-- COMET_MCP_SCRIPT -->
  </body>
</html>
